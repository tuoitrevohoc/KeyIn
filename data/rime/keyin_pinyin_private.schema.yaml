schema:
  schema_id: keyin_pinyin_private
  name: KeyIn 简体拼音（不学习）
  version: '1'
switches:
  - name: ascii_mode
    reset: 0
  - name: full_shape
    reset: 0
engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
translator:
  dictionary: pinyin_simp
  enable_sentence: true
  enable_user_dict: false
  enable_completion: true
  preedit_format:
    - "xform/ /'/"
menu:
  page_size: 9
