name: KeyIn
options:
  bundleIdPrefix: com.banhtieu
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: 0.5.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 264RB56734
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridging.h
    TARGETED_DEVICE_FAMILY: "1,2"
    "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": $(PROJECT_DIR)/Engine/lib/aarch64-apple-ios
    "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": $(PROJECT_DIR)/Engine/lib/aarch64-apple-ios-sim
    OTHER_LDFLAGS: -lkeyin
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
targets:
  KeyIn:
    type: application
    platform: iOS
    sources: [KeyInApp, Shared]
    info:
      path: KeyInApp/Info.plist
      properties:
        CFBundleDisplayName: KeyIn
        UILaunchScreen: {}
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banhtieu.keyin
    dependencies:
      - target: KeyInKeyboard
  KeyInKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyInKeyboard
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.banhtieu.keyin.keyboard
        INFOPLIST_FILE: KeyInKeyboard/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
